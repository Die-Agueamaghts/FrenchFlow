name: Update categories from pics

on:
  push:
    paths:
      - 'pics/**'
  pull_request:
    paths:
      - 'pics/**'

jobs:
  update-categories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run update script (Python)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python FrenchFlow/scripts/update_categories.py
