name: Update categories from pics

on:
  push:
    paths:
      - 'pics/**'
  pull_request:
    paths:
      - 'pics/**'

jobs:
  update-categories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run update script (Python)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python FrenchFlow/scripts/update_categories.py

      - name: Create pull request with changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: update categories.js from pics/ (CI)
          branch: update/categories-${{ github.run_id }}
          title: chore: update categories.js from pics/
          body: |
            This PR was automatically generated by the categories updater.
            It contains updated `categories.js` entries based on files discovered in `pics/`.
          base: main
          labels: automated
